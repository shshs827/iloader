name: Build iloader-cli

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cli.yml'

jobs:
  build-windows-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust & cargo-zigbuild
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          rustup target add x86_64-pc-windows-gnu
          pip3 install --break-system-packages ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Extract Signatures & Generate Code (Bulletproof)
        shell: python
        run: |
          import pathlib, re, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          def split_params(raw: str):
              res, cur, d_ang, d_par = [], "", 0, 0
              for ch in raw:
                  if ch == "<": d_ang += 1
                  elif ch == ">": d_ang -= 1
                  elif ch == "(": d_par += 1
                  elif ch == ")": d_par -= 1
                  if ch == "," and d_ang == 0 and d_par == 0:
                      if cur.strip(): res.append(cur.strip())
                      cur = ""
                  else:
                      cur += ch
              if cur.strip(): res.append(cur.strip())
              return res

          # --- 1. Patch remote_v3/mod.rs ---
          matches = list(pathlib.Path(".").rglob("remote_v3/mod.rs"))
          if not matches:
              sys.exit("ERROR: 找不到 remote_v3/mod.rs")
          anisette_path = matches[0]
          isideload_dir = anisette_path.parents[3]
          src_dir = isideload_dir / "src"

          a_src = anisette_path.read_text(encoding="utf-8")
          a_src = re.sub(r'https://ani\.[a-zA-Z0-9.-]+', 'https://ani.jkcoxson.com', a_src)

          url_field_m = re.search(r'(\w+)\s*:\s*String', a_src)
          url_field = url_field_m.group(1) if url_field_m else "url"
          client_field_m = re.search(r'(\w+)\s*:\s*(?:reqwest(?:_middleware)?::)?Client', a_src)
          client_expr = f"self.{client_field_m.group(1)}" if client_field_m else "reqwest::Client::new()"

          fn_match = re.search(
              r'(?P<sig>(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+get_client_info\s*\([^)]*\)\s*(?:->\s*[^{]+)?)\{',
              a_src
          )
          if fn_match:
              sig = fn_match.group("sig")
              is_async = "async " in sig
              ret_type = sig.split("->", 1)[1].strip() if "->" in sig else ""
              is_result = "Result" in ret_type

              if not is_async:
                  sig = sig.replace("fn get_client_info", "async fn get_client_info")
                  a_src = re.sub(r'(\.get_client_info\(\))(?!\s*\.await)', r'\1.await', a_src)

              start_brace = fn_match.end() - 1
              depth, end_brace = 0, start_brace
              for idx in range(start_brace, len(a_src)):
                  if a_src[idx] == '{': depth += 1
                  elif a_src[idx] == '}':
                      depth -= 1
                      if depth == 0:
                          end_brace = idx
                          break

              orig_body = a_src[start_brace + 1 : end_brace]
              struct_ret_m = re.search(r'([A-Za-z_]\w*(?:::[A-Za-z_]\w*)*)\s*\{([^{}]+)\}\s*\)?\s*$', orig_body.strip())
              if struct_ret_m:
                  s_name = struct_ret_m.group(1)
                  s_fields = re.findall(r'(\w+)\s*:', struct_ret_m.group(2))
                  assigns = [
                      f"{f}: user_agent" if "agent" in f.lower() else f"{f}: client_info"
                      for f in s_fields
                  ]
                  val_expr = f"{s_name} {{ {', '.join(assigns)} }}"
              else:
                  val_expr = "(client_info, user_agent)"

              ret_stmt = f"Ok({val_expr})" if is_result else val_expr

              fetch_code = f"""{{
                  let endpoint = format!("{{}}/v3/client_info", self.{url_field}.trim_end_matches('/'));
                  let resp: serde_json::Value = {client_expr}
                      .get(&endpoint)
                      .send()
                      .await?
                      .error_for_status()?
                      .json()
                      .await?;
                  let client_info = resp["client_info"].as_str().or_else(|| resp["Client-Info"].as_str()).unwrap_or("<MacBookPro15,1> <macOS;13.4.1;22F82> <com.apple.AuthKit/1 (com.apple.dt.Xcode/3594.4.19)>").to_string();
                  let user_agent = resp["user_agent"].as_str().or_else(|| resp["User-Agent"].as_str()).unwrap_or("akd/1.0 CFNetwork/1408.0.4 Darwin/22.5.0").to_string();
                  {ret_stmt}
              }}"""
              a_src = a_src[:fn_match.start()] + sig + fetch_code + a_src[end_brace + 1:]

          anisette_path.write_text(a_src, encoding="utf-8")

          # --- 2. Patch sideloader.rs ---
          s_matches = list(pathlib.Path(".").rglob("sideloader.rs"))
          if s_matches:
              sideloader_path = s_matches[0]
              lines = sideloader_path.read_text(encoding="utf-8").splitlines()
              patched_lines = []
              in_group_section = False
              for i, line in enumerate(lines):
                  low = line.lower()
                  if "group" in low and ("fn " in low or "associate" in low or "app_group" in low):
                      in_group_section = True
                  elif line.startswith(("    fn ", "    pub fn ", "    async fn ", "    pub async fn ")):
                      in_group_section = False
                  if in_group_section and "watch" in low and ("continue" in low or "skip" in low):
                      patched_lines.append(f"// [patched] {line}")
                      continue
                  if in_group_section and "DeviceType::Ios" in line:
                      var_match = re.search(r'\b(bundle|sub_app|watch_app|target|item)\b', "\n".join(lines[max(0, i-12):i+1]))
                      var_name = var_match.group(1) if var_match else "bundle"
                      enum_prefix = "DeveloperDeviceType" if "DeveloperDeviceType::Ios" in line else "DeviceType"
                      line = line.replace(f"{enum_prefix}::Ios", f"if {var_name}.is_watch() {{ {enum_prefix}::Watchos }} else {{ {enum_prefix}::Ios }}")
                  patched_lines.append(line)
                  if "download_provisioning_profile" in low and ".await" in low:
                      indent = re.match(r'^(\s*)', line).group(1)
                      patched_lines.append(f'{indent}if let Some(ref prof_data) = Option::Some(&profile) {{')
                      patched_lines.append(f'{indent}    if !format!("{{:?}}", prof_data).contains("application-groups") {{ eprintln!("Warning: downloaded profile missing application-groups"); }}')
                      patched_lines.append(f'{indent}}}')
              sideloader_path.write_text("\n".join(patched_lines) + "\n", encoding="utf-8")

          # --- 3. Extract Signatures ---
          full_isideload_src = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in src_dir.rglob("*.rs"))
          tauri_src_all = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in pathlib.Path("src-tauri/src").rglob("*.rs")) if pathlib.Path("src-tauri/src").exists() else ""

          def resolve_item_path(item_name: str, fallback: str) -> str:
              use_m = re.search(rf'use\s+(isideload::[a-zA-Z0-9_:]+::{re.escape(item_name)})\s*;', tauri_src_all)
              if use_m: return use_m.group(1)
              for rs in src_dir.rglob("*.rs"):
                  if re.search(rf'pub\s+(?:struct|enum|trait)\s+{re.escape(item_name)}\b', rs.read_text(encoding="utf-8", errors="ignore")):
                      parts = list(rs.relative_to(src_dir).with_suffix("").parts)
                      mod_rs = rs.parent / "mod.rs"
                      mod_txt = mod_rs.read_text(encoding="utf-8", errors="ignore") if mod_rs.exists() else ""
                      if parts[-1] == "mod" or re.search(rf'pub\s+use\s+.*(?:\*|{re.escape(item_name)})\s*;', mod_txt):
                          return "isideload::" + "::".join(parts[:-1] + [item_name])
                      return "isideload::" + "::".join(parts + [item_name])
              return fallback

          dev_session_use = resolve_item_path("DeveloperSession", "isideload::dev::DeveloperSession")

          anisette_type = "AnisetteConfiguration"
          for cand in ["AnisetteConfiguration", "AnisetteClient", "AnisetteConfig", "RemoteV3AnisetteProvider"]:
              if re.search(rf'pub\s+(?:struct|enum)\s+{cand}\b', full_isideload_src):
                  anisette_type = cand
                  break
          anisette_use = resolve_item_path(anisette_type, f"isideload::anisette::{anisette_type}")

          tauri_anisette_m = re.search(rf'({re.escape(anisette_type)}::[a-zA-Z0-9_]+\([^;]*?\))(?:;|\.|,|\))', tauri_src_all)
          if tauri_anisette_m:
              anisette_init = tauri_anisette_m.group(1)
              if "set_configuration_path" in tauri_src_all: anisette_init += ".set_configuration_path(std::env::temp_dir())"
          elif re.search(rf'#\[derive\([^\]]*Default[^\]]*\)\]\s*pub\s+struct\s+{anisette_type}\b', full_isideload_src):
              anisette_init = f"{anisette_type}::default()"
          else: anisette_init = f"{anisette_type}::new()"

          dev_src_all = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in (src_dir / "dev").rglob("*.rs")) if (src_dir / "dev").exists() else full_isideload_src
          login_m = re.search(r'pub\s+async\s+fn\s+login\s*(?:<[^>]+>)?\s*\(([\s\S]*?)\)\s*(?:->\s*([^{]+))?\{', dev_src_all)
          login_params_raw = login_m.group(1) if login_m else ""
          login_ret_raw = login_m.group(2) if (login_m and login_m.group(2)) else ""

          login_call_args, str_idx = [], 0
          for p in split_params(login_params_raw):
              if ":" not in p: continue
              pname, ptype = [x.strip() for x in p.split(":", 1)]
              if "str" in ptype or "String" in ptype:
                  val = "&apple_id" if str_idx == 0 else "&password"
                  if "String" in ptype and "&" not in ptype: val = f"{val.replace('&', '')}.clone()"
                  login_call_args.append(val); str_idx += 1
              elif "Anisette" in ptype or "Provider" in ptype:
                  login_call_args.append("&mut anisette_config" if "&mut" in ptype else ("&anisette_config" if "&" in ptype else "anisette_config"))
              elif "Fn" in ptype or "tfa" in pname.lower() or "code" in pname.lower() or "2fa" in pname.lower():
                  is_async_cb = "Future" in (ptype + login_ret_raw)
                  head = "|_|" if re.search(r'Fn(?:Mut|Once)?\s*\([^)]+\)', ptype + login_ret_raw) else "||"
                  inner = 'prompt("请输入受信任设备收到的 6 位验证码: ").unwrap_or_default()'
                  if "Result<" in (ptype + login_ret_raw): inner = f"Ok({inner})"
                  elif "Option<" in (ptype + login_ret_raw): inner = f"Some({inner})"
                  login_call_args.append(f"{head} async move {{ {inner} }}" if is_async_cb else f"{head} {{ {inner} }}")
              elif "Option<" in ptype: login_call_args.append("None")
              else: login_call_args.append("Default::default()")

          sideloader_src = sideloader_path.read_text(encoding="utf-8", errors="ignore") if s_matches else full_isideload_src
          sideload_m = re.search(r'pub\s+async\s+fn\s+sideload\s*(?:<[^>]+>)?\s*\(([\s\S]*?)\)\s*(?:->\s*([^{]+))?\{', sideloader_src)
          sideload_params_raw = sideload_m.group(1) if sideload_m else ""
          sideload_ret_raw = sideload_m.group(2) if (sideload_m and sideload_m.group(2)) else ""
          
          sideload_call_args = []
          for p in split_params(sideload_params_raw):
              if ":" not in p: continue
              pname, ptype = [x.strip() for x in p.split(":", 1)]
              if "DeveloperSession" in ptype: sideload_call_args.append("&mut session" if "&mut" in ptype else "&session")
              elif "Provider" in ptype or "Usbmuxd" in ptype or "Device" in ptype or "Idevice" in ptype:
                  sideload_call_args.append("&mut provider" if "&mut" in ptype else ("&provider" if "&" in ptype else "provider"))
              elif "Path" in ptype: sideload_call_args.append("&ipa_path" if "&" in ptype else "ipa_path.clone()")
              elif "Fn" in ptype or "progress" in pname.lower() or "callback" in pname.lower():
                  sideload_call_args.append("|_| {}" if re.search(r'Fn(?:Mut|Once)?\s*\([^)]+\)', ptype + sideload_ret_raw) else "|| {}")
              elif "Option<" in ptype: sideload_call_args.append("None")
              else: sideload_call_args.append("Default::default()")

          list_cert_m = re.search(r'pub\s+async\s+fn\s+(\w*cert\w*)\s*\(([^)]*)\)', dev_src_all)
          list_cert_fn = list_cert_m.group(1) if list_cert_m else "list_certificates"
          list_cert_extra = []
          if list_cert_m:
              for p in split_params(list_cert_m.group(2)):
                  if "self" in p or ":" not in p: continue
                  list_cert_extra.append("None" if "Option<" in p.split(":", 1)[1] else "Default::default()")

          revoke_cert_m = re.search(r'pub\s+async\s+fn\s+((?:revoke|delete)\w*cert\w*)\s*\(([^)]*)\)', dev_src_all)
          revoke_cert_fn = revoke_cert_m.group(1) if revoke_cert_m else "revoke_certificate"
          revoke_cert_extra = []
          if revoke_cert_m:
              for p in split_params(revoke_cert_m.group(2)):
                  if "self" in p or ":" not in p: continue
                  ptype = p.split(":", 1)[1].strip()
                  if "str" in ptype: revoke_cert_extra.append("&serial")
                  elif "String" in ptype: revoke_cert_extra.append("serial.clone()")
                  elif "Option<" in ptype: revoke_cert_extra.append("None")
                  else: revoke_cert_extra.append("Default::default()")

          cert_struct_m = re.search(r'pub\s+struct\s+\w*Certificate\w*\s*\{([^}]*)\}', dev_src_all)
          cert_fields = cert_struct_m.group(1) if cert_struct_m else ""
          cert_name_expr = "cert.name" if "name:" in cert_fields else ('cert.machine_name' if "machine_name:" in cert_fields else '"Certificate"')
          cert_serial_expr = "cert.serial_number" if "serial_number:" in cert_fields else ("cert.serial" if "serial:" in cert_fields else ("cert.certificate_id" if "certificate_id:" in cert_fields else "cert.id"))

          # --- 4. Generate Cargo Project ---
          idevice_toml_line = 'idevice = "*"'
          if pathlib.Path("src-tauri/Cargo.toml").exists():
              try:
                  tauri_toml_data = tomllib.loads(pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"))
                  idevice_raw = tauri_toml_data.get("dependencies", {}).get("idevice", "*")
                  if isinstance(idevice_raw, str):
                      idevice_toml_line = f'idevice = "{idevice_raw}"'
                  elif isinstance(idevice_raw, dict):
                      parts = []
                      for k, v in idevice_raw.items():
                          if isinstance(v, str): parts.append(f'{k} = "{v}"')
                          elif isinstance(v, bool): parts.append(f'{k} = {"true" if v else "false"}')
                          elif isinstance(v, list): parts.append(f'{k} = [{", ".join(chr(34)+x+chr(34) for x in v)}]')
                      idevice_toml_line = f"idevice = {{ {', '.join(parts)} }}"
              except Exception as e:
                  print(f"Error parsing tauri toml: {e}")

          cli_dir = pathlib.Path("iloader-cli/src")
          cli_dir.mkdir(parents=True, exist_ok=True)
          if pathlib.Path("src-tauri/Cargo.lock").exists():
              pathlib.Path("iloader-cli/Cargo.lock").write_bytes(pathlib.Path("src-tauri/Cargo.lock").read_bytes())

          rel_isideload = "../vendor/isideload/isideload"
          cargo_toml = "\n".join(["[package]", 'name = "iloader-cli"', 'version = "0.1.0"', 'edition = "2021"', "", "[dependencies]", f'isideload = {{ path = "{rel_isideload}" }}', idevice_toml_line, 'tokio = { version = "1", features = ["full"] }', 'rpassword = "7"', 'anyhow = "1"', 'rustls = { version = "0.23", features = ["ring"] }']) + "\n"
          pathlib.Path("iloader-cli/Cargo.toml").write_text(cargo_toml, encoding="utf-8")

          login_args_str = ", ".join(login_call_args)
          sideload_args_str = ", ".join(sideload_call_args)
          list_extra_str = ", ".join(list_cert_extra)
          revoke_extra_str = ", ".join(revoke_cert_extra)

          main_rs = f"""use anyhow::{{Context, Result}};
          use std::env;
          use std::io::{{self, Write}};
          use std::path::PathBuf;
          use {dev_session_use};
          use {anisette_use};
          use isideload::sideload::sideloader;
          use idevice::usbmuxd::{{UsbmuxdAddr, UsbmuxdConnection}};

          fn prompt(label: &str) -> Result<String> {{ print!("{{}}", label); io::stdout().flush()?; let mut i = String::new(); io::stdin().read_line(&mut i)?; Ok(i.trim().to_string()) }}

          #[tokio::main]
          async fn main() -> Result<()> {{
              rustls::crypto::ring::default_provider().install_default().ok();
              let ipa_path = PathBuf::from(&env::args().nth(1).context("Usage: iloader-cli.exe <ipa>")?);
              if !ipa_path.exists() {{ anyhow::bail!("找不到 IPA 文件: {{}}", ipa_path.display()); }}

              println!("正在连接 usbmuxd 搜索 iPhone...");
              let mut usbmuxd = UsbmuxdConnection::default().await.context("无法连接 usbmuxd")?;
              let dev = usbmuxd.get_devices().await?.into_iter().next().context("未检测到设备")?;
              println!("已检测到设备 UDID: {{}}", dev.udid);
              let mut provider = dev.to_provider(UsbmuxdAddr::default(), "iloader-cli");

              let apple_id = prompt("Apple ID: ")?;
              let password = rpassword::prompt_password("Password: ")?;
              let mut anisette_config = {anisette_init};
              let mut session = DeveloperSession::login({login_args_str}).await?;

              if let Err(err) = sideloader::sideload({sideload_args_str}).await {{
                  let msg = format!("{{:?}}", err);
                  if msg.contains("7460") || msg.contains("too many") {{
                      println!("检测到证书已满，正在获取现有证书...");
                      let certs = session.{list_cert_fn}({list_extra_str}).await?;
                      for cert in &certs {{ println!("名称: {{}} | 序列号: {{}}", {cert_name_expr}, {cert_serial_expr}); }}
                      let serial = prompt("请输入要吊销的证书序列号: ")?;
                      session.{revoke_cert_fn}({revoke_extra_str}).await?;
                      println!("证书已吊销，重新签名...");
                      sideloader::sideload({sideload_args_str}).await?;
                  }} else {{ return Err(err.into()); }}
              }}
              println!("DONE");
              Ok(())
          }}
          """
          pathlib.Path("iloader-cli/src/main.rs").write_text("\n".join(l[14:] if l.startswith("              ") else l for l in main_rs.splitlines()) + "\n", encoding="utf-8")

      - name: Cross-compile iloader-cli.exe
        shell: bash
        run: |
          cd iloader-cli
          cargo zigbuild --release --target x86_64-pc-windows-gnu

      - name: Upload iloader-cli.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: iloader-cli-windows
          path: iloader-cli/target/x86_64-pc-windows-gnu/release/iloader-cli.exe
