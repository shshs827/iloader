name: Build iloader-cli

on:
  workflow_dispatch:

jobs:
  build-windows-cli:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply isideload patches & generate iloader-cli
        shell: python
        run: |
          import pathlib, re, sys

          # ==============================================================================
          # 1. 修复 remote_v3/mod.rs：默认服务器改为 https://ani.jkcoxson.com 且动态拉取 /v3/client_info
          # ==============================================================================
          anisette_path = pathlib.Path("vendor/isideload/isideload/src/anisette/remote_v3/mod.rs")
          if not anisette_path.exists():
              matches = list(pathlib.Path("vendor").rglob("remote_v3/mod.rs"))
              if not matches:
                  sys.exit("ERROR: 找不到 remote_v3/mod.rs，请确认已切换到正确的 watch 分支")
              anisette_path = matches[0]

          a_src = anisette_path.read_text(encoding="utf-8")
          # 替换所有 anisette 默认域名为 https://ani.jkcoxson.com
          a_src = re.sub(r'https://ani\.[a-zA-Z0-9.-]+', 'https://ani.jkcoxson.com', a_src)

          # 提取 struct 中存储服务器 URL 和 HTTP Client 的字段名
          url_field_match = re.search(r'(\w+)\s*:\s*String', a_src)
          url_field = url_field_match.group(1) if url_field_match else "url"
          client_field_match = re.search(r'(\w+)\s*:\s*(?:reqwest::)?Client', a_src)
          client_expr = f"self.{client_field_match.group(1)}" if client_field_match else "reqwest::Client::new()"

          # 定位并重写 get_client_info() 函数体
          fn_match = re.search(
              r'(?P<sig>(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+get_client_info\s*\([^)]*\)\s*(?:->\s*[^{]+)?)\{',
              a_src
          )
          if fn_match:
              sig = fn_match.group("sig")
              is_async = "async " in sig
              ret_type = sig.split("->")[1].strip() if "->" in sig else ""
              is_result = "Result" in ret_type
              returns_tuple = "(" in ret_type and "," in ret_type

              if not is_async:
                  sig = sig.replace("fn get_client_info", "async fn get_client_info")
                  a_src = re.sub(r'(\.get_client_info\(\))(?!\s*\.await)', r'\1.await', a_src)

              start_brace = fn_match.end() - 1
              depth = 0
              end_brace = start_brace
              for idx in range(start_brace, len(a_src)):
                  if a_src[idx] == '{':
                      depth += 1
                  elif a_src[idx] == '}':
                      depth -= 1
                      if depth == 0:
                          end_brace = idx
                          break

              fetch_code = f"""{{
                  let endpoint = format!("{{}}/v3/client_info", self.{url_field}.trim_end_matches('/'));
                  let resp: serde_json::Value = {client_expr}
                      .get(&endpoint)
                      .send()
                      .await?
                      .error_for_status()?
                      .json()
                      .await?;
                  let client_info = resp["client_info"]
                      .as_str()
                      .or_else(|| resp["Client-Info"].as_str())
                      .unwrap_or("<MacBookPro15,1> <macOS;13.4.1;22F82> <com.apple.AuthKit/1 (com.apple.dt.Xcode/3594.4.19)>")
                      .to_string();
                  let user_agent = resp["user_agent"]
                      .as_str()
                      .or_else(|| resp["User-Agent"].as_str())
                      .unwrap_or("akd/1.0 CFNetwork/1408.0.4 Darwin/22.5.0")
                      .to_string();
              """
              if returns_tuple:
                  ret_expr = "    Ok((client_info, user_agent))\n}" if is_result else "    (client_info, user_agent)\n}"
              else:
                  ret_expr = "    Ok(ClientInfo { client_info, user_agent })\n}" if is_result else "    ClientInfo { client_info, user_agent }\n}"

              a_src = a_src[:fn_match.start()] + sig + fetch_code + ret_expr + a_src[end_brace + 1:]

          anisette_path.write_text(a_src, encoding="utf-8")
          print(f"Patched {anisette_path} successfully.")

          # ==============================================================================
          # 2. 修复 sideloader.rs：不跳过 Watch 应用的 App Group 关联，传入 Watchos 并校验权限
          # ==============================================================================
          sideloader_path = pathlib.Path("vendor/isideload/isideload/src/sideload/sideloader.rs")
          if not sideloader_path.exists():
              matches = list(pathlib.Path("vendor").rglob("sideloader.rs"))
              if not matches:
                  sys.exit("ERROR: 找不到 sideloader.rs")
              sideloader_path = matches[0]

          s_src = sideloader_path.read_text(encoding="utf-8")
          lines = s_src.splitlines()
          patched_lines = []
          in_group_section = False

          for i, line in enumerate(lines):
              low = line.lower()
              if "group" in low and ("fn " in low or "associate" in low or "app_group" in low):
                  in_group_section = True
              elif line.startswith("    fn ") or line.startswith("    pub fn ") or line.startswith("    async fn ") or line.startswith("    pub async fn "):
                  in_group_section = False

              # 移除 App Group 关联循环中跳过 Watch 应用的条件
              if in_group_section and "watch" in low and ("continue" in low or "skip" in low):
                  patched_lines.append(f"// [patched] {line}")
                  continue

              # 将硬编码 Ios 替换为根据 bundle 是否为 watch 动态传入 Watchos / Ios
              if in_group_section and "DeviceType::Ios" in line:
                  # 检测当前上下文变量名（bundle / app / ext / target）
                  var_match = re.search(r'\b(bundle|sub_app|watch_app|target|item)\b', "\n".join(lines[max(0, i-12):i+1]))
                  var_name = var_match.group(1) if var_match else None
                  if var_name:
                      enum_prefix = "DeveloperDeviceType" if "DeveloperDeviceType::Ios" in line else "DeviceType"
                      replacement = f"if {var_name}.is_watch() {{ {enum_prefix}::Watchos }} else {{ {enum_prefix}::Ios }}"
                      line = line.replace(f"{enum_prefix}::Ios", replacement)

              patched_lines.append(line)

              # 在下载描述文件后注入 entitlements group 校验日志/断言
              if "download_provisioning_profile" in low and ".await" in low:
                  indent = re.match(r'^(\s*)', line).group(1)
                  patched_lines.append(f'{indent}// Verify provisioning profile entitlements contain App Group when configured')
                  patched_lines.append(f'{indent}if let Some(ref prof_data) = Option::Some(&profile) {{')
                  patched_lines.append(f'{indent}    let raw_str = format!("{{:?}}", prof_data);')
                  patched_lines.append(f'{indent}    if !raw_str.contains("application-groups") {{')
                  patched_lines.append(f'{indent}        eprintln!("Warning: downloaded profile entitlements missing application-groups");')
                  patched_lines.append(f'{indent}    }}')
                  patched_lines.append(f'{indent}}}')

          sideloader_path.write_text("\n".join(patched_lines) + "\n", encoding="utf-8")
          print(f"Patched {sideloader_path} successfully.")

          # ==============================================================================
          # 3. 探测 isideload 真实接口并生成零报错的 iloader-cli 工程
          # ==============================================================================
          isideload_dir = sideloader_path.parents[2]
          lib_rs = (isideload_dir / "src/lib.rs").read_text(encoding="utf-8", errors="ignore")
          sideload_mod = (isideload_dir / "src/sideload/mod.rs").read_text(encoding="utf-8", errors="ignore") if (isideload_dir / "src/sideload/mod.rs").exists() else ""
          full_isideload_src = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in (isideload_dir / "src").rglob("*.rs"))

          # 探测 Sideloader::new 与 install_ipa 的实际参数列表
          new_sig = re.search(r'pub\s+fn\s+new\s*\(([^)]*)\)', full_isideload_src)
          new_params = new_sig.group(1) if new_sig else "session: DeveloperSession"
          install_sig = re.search(r'pub\s+async\s+fn\s+install_ipa\s*\(([^)]*)\)', full_isideload_src)
          install_params = install_sig.group(1) if install_sig else "&self, ipa_path: &Path"

          needs_device_in_new = "Device" in new_params
          needs_device_in_install = "Device" in install_params
          needs_device = needs_device_in_new or needs_device_in_install

          cli_dir = pathlib.Path("iloader-cli/src")
          cli_dir.mkdir(parents=True, exist_ok=True)

          # 复用原仓库锁定的 Cargo.lock（保留 apple-codesign 历史可用 commit）
          lock_src = pathlib.Path("src-tauri/Cargo.lock")
          if not lock_src.exists():
              locks = list(pathlib.Path(".").rglob("Cargo.lock"))
              if locks:
                  lock_src = locks[0]
          if lock_src.exists():
              pathlib.Path("iloader-cli/Cargo.lock").write_bytes(lock_src.read_bytes())

          rel_isideload = "../" + isideload_dir.as_posix()
          cargo_toml = f"""[package]
          name = "iloader-cli"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          isideload = {{ path = "{rel_isideload}" }}
          tokio = {{ version = "1", features = ["full"] }}
          rpassword = "7"
          anyhow = "1"
          rustls = {{ version = "0.23", features = ["ring"] }}
          """
          pathlib.Path("iloader-cli/Cargo.toml").write_text("\n".join(l.strip() for l in cargo_toml.splitlines()) + "\n", encoding="utf-8")

          device_setup_code = ""
          if needs_device:
              device_setup_code = """
              println!("正在搜索通过 USB 连接的 iPhone...");
              let devices = isideload::device::Device::get_devices().await
                  .context("无法读取 USB 设备列表，请确认已安装桌面版 iTunes 且手机已信任此电脑")?;
              let device = devices.into_iter().next()
                  .context("未检测到已连接的 iPhone，请检查 USB 数据线")?;
              println!("已连接设备: {} ({})", device.name, device.udid);
          """

          sideloader_init = "let sideloader = Sideloader::new(session, device);" if needs_device_in_new else "let sideloader = Sideloader::new(session);"
          install_call = "sideloader.install_ipa(&device, &ipa_path).await" if needs_device_in_install else "sideloader.install_ipa(&ipa_path).await"

          main_rs = f"""use anyhow::{{Context, Result}};
          use std::env;
          use std::io::{{self, Write}};
          use std::path::PathBuf;

          use isideload::anisette::AnisetteConfiguration;
          use isideload::developer::DeveloperSession;
          use isideload::sideload::Sideloader;

          fn prompt(label: &str) -> Result<String> {{
              print!("{{}}", label);
              io::stdout().flush()?;
              let mut input = String::new();
              io::stdin().read_line(&mut input)?;
              Ok(input.trim().to_string())
          }}

          #[tokio::main]
          async fn main() -> Result<()> {{
              rustls::crypto::ring::default_provider()
                  .install_default()
                  .expect("Failed to install rustls ring provider");

              let ipa_arg = env::args()
                  .nth(1)
                  .context("用法: iloader-cli.exe <HermesEnabler.ipa路径>")?;
              let ipa_path = PathBuf::from(&ipa_arg);
              if !ipa_path.exists() {{
                  anyhow::bail!("找不到 IPA 文件: {{}}", ipa_path.display());
              }}
          {device_setup_code}
              let apple_id = prompt("Apple ID: ")?;
              let password = rpassword::prompt_password("Password (输入时不显示): ")?;

              let anisette_config = AnisetteConfiguration::default();
              let session = DeveloperSession::login(&apple_id, &password, anisette_config, || {{
                  prompt("请输入受信任设备收到的 6 位验证码: ").unwrap_or_default()
              }})
              .await?;

              {sideloader_init}
              if let Err(err) = {install_call} {{
                  let err_msg = format!("{{:?}}", err);
                  if err_msg.contains("7460") {{
                      println!("检测到 error 7460（开发证书数量已达上限），正在获取现有证书...");
                      let certs = sideloader.list_certificates().await?;
                      for cert in &certs {{
                          println!("名称: {{}} | 序列号: {{}}", cert.name, cert.serial_number);
                      }}
                      let serial = prompt("请输入要吊销的证书序列号: ")?;
                      sideloader.revoke_certificate(&serial).await?;
                      println!("旧证书已吊销，正在重新签名并推送至 iPhone 和 Apple Watch...");
                      {install_call}?;
                  }} else {{
                      return Err(err.into());
                  }}
              }}

              println!("DONE");
              Ok(())
          }}
          """
          pathlib.Path("iloader-cli/src/main.rs").write_text("\n".join(l[10:] if l.startswith("          ") else l for l in main_rs.splitlines()) + "\n", encoding="utf-8")
          print("Generated iloader-cli/Cargo.toml and iloader-cli/src/main.rs successfully.")

      - name: Show applied patch diff
        shell: bash
        run: git -C vendor/isideload diff || git diff

      - name: Build iloader-cli.exe
        shell: bash
        run: |
          cd iloader-cli
          cargo build --release

      - name: Upload iloader-cli.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: iloader-cli-windows
          path: iloader-cli/target/release/iloader-cli.exe
